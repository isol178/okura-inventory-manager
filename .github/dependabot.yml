version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: saturday
      timezone: Asia/Tokyo
    groups:
      dev-dependencies:
        dependency-type: development
      dependencies:
        dependency-type: production
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
      timezone: Asia/Tokyo
    groups:
      github-actions:
        patterns: ["*"]
    cooldown:
      default-days: 7

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
      day: saturday
      timezone: Asia/Tokyo
    groups:
      pre-commit:
        patterns: ["*"]
